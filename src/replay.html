<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>操作記録の再生 — 商い帖</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230f766e'/%3E%3Ctext x='32' y='44' font-family='sans-serif' font-size='32' fill='white' text-anchor='middle'%3E%E5%95%86%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/rrweb-player.css?v=2.2.2" />
    <link rel="stylesheet" href="/replay.css" />
  </head>
  <body class="replay-page">
    <header class="replay-header">
      <a class="replay-brand" href="/">商い帖</a>
      <div class="replay-heading">
        <h1 id="replay-title">操作記録の再生</h1>
        <p class="lead" id="replay-meta">読み込み中…</p>
      </div>
      <div class="replay-header-actions">
        <a class="link" id="replay-source" target="_blank" rel="noopener" hidden>元の画面を開く</a>
        <a class="secondary replay-back" href="/#/recordings">記録一覧へ</a>
      </div>
    </header>

    <main class="replay-main">
      <section class="card replay-stage">
        <div id="player" class="replay-player"></div>
        <div id="replay-error" class="empty" hidden></div>
      </section>

      <aside class="replay-side">
        <section class="card">
          <div class="card-head">お問い合わせ内容</div>
          <div class="replay-inquiry" id="inquiry">
            <p class="empty small">読み込み中…</p>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <span>主な操作</span>
            <span class="replay-step-count" id="step-count"></span>
          </div>
          <ol class="replay-steps" id="steps"></ol>
        </section>
      </aside>
    </main>

    <script src="/rrweb-player.js?v=2.2.2"></script>
    <script src="/replay.js"></script>
  </body>
</html>
