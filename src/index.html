<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rs-wk</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1120;
        color: #e2e8f0;
      }
      main {
        width: min(36rem, calc(100% - 2rem));
        padding: 2.5rem;
        border: 1px solid #1e293b;
        border-radius: 1rem;
        background: #111827;
        box-shadow: 0 24px 64px rgb(0 0 0 / 0.4);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #94a3b8;
        line-height: 1.7;
      }
      code {
        padding: 0.15rem 0.4rem;
        border-radius: 0.35rem;
        background: #1e293b;
        color: #f8fafc;
        font-size: 0.9em;
      }
      #status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        background: #1e293b;
        font-size: 0.9rem;
      }
      #dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: #64748b;
      }
      #dot.ok {
        background: #22c55e;
      }
      #dot.error {
        background: #ef4444;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>rs-wk</h1>
      <p>
        Rust + Cloudflare Workers で動く Web アプリケーションの雛形です。
        <code>src/lib.rs</code> から編集を始めてください。
      </p>
      <div id="status">
        <span id="dot"></span>
        <span id="message">API を確認中…</span>
      </div>
    </main>
    <script>
      const dot = document.getElementById("dot");
      const message = document.getElementById("message");

      fetch("/api/health")
        .then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then((data) => {
          dot.classList.add("ok");
          message.textContent = `API: ${data.status} / ${data.runtime}`;
        })
        .catch((err) => {
          dot.classList.add("error");
          message.textContent = `API エラー: ${err.message}`;
        });
    </script>
  </body>
</html>
