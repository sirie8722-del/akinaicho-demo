name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache worker-build
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-0.8.7

      - name: Install worker-build
        run: command -v worker-build >/dev/null || cargo install worker-build --version 0.8.7 --locked

      - name: Validate Cloudflare token format
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf 'token_length=%s\n' "${#CF_TOKEN}"
          if [[ ! "$CF_TOKEN" =~ ^[A-Za-z0-9_-]{40}$ ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN must be a 40-character Cloudflare API token without spaces or newlines."
            exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://akinaicho-demo.s-irie8722.workers.dev/api/health
