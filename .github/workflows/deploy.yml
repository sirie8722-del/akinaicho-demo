name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify deployment ref
        run: |
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Deploy is only allowed from main or a tag on main."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::The tag must point to a commit on main."
              exit 1
            fi
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache worker-build
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-0.8.7

      - name: Install worker-build
        run: command -v worker-build >/dev/null || cargo install worker-build --version 0.8.7 --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Build Worker
        run: npm run build

      - name: Verify Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          ACCOUNT="$(printf '%s' "$CF_ACCOUNT_ID" | tr -d '[:space:]')"
          echo "::add-mask::$TOKEN"
          printf 'token_raw_length=%s token_trimmed_length=%s account_length=%s\n' \
            "${#CF_TOKEN}" "${#TOKEN}" "${#ACCOUNT}"
          RESPONSE="$(curl --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          echo "$RESPONSE" | jq -c '{success, errors, status: .result.status}'
          echo "$RESPONSE" | jq -e '.success == true' >/dev/null

      - name: Deploy
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://akinaicho-demo.s-irie8722.workers.dev/api/health
